name: Deploy Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-kaya-dashboard
  cancel-in-progress: false

env:
  NODE_VERSION: 22.12.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-out
          path: out/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-out
          path: out/

      - name: Start SSH agent and add key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DASHBOARD_SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DASHBOARD_SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          rsync -rav --delete out/ \
            ${{ secrets.DASHBOARD_SSH_USER }}@${{ secrets.DASHBOARD_SERVER_HOST }}:${{ secrets.DASHBOARD_SERVER_PATH }}/
